<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Movie Ticket Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 p-6 flex justify-center">
  <div class="w-full max-w-lg space-y-6">

    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-amber-400">Movie Ticket Booking</h1>
      <p class="text-sm text-gray-400">Select your seats or ask our AI</p>
    </div>

    <!-- AI Helper -->
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl shadow">
      <h2 class="text-sm font-bold text-amber-400 mb-2">🤖 AI Movie Assistant</h2>
      <div class="flex gap-2">
        <input id="aiInput" type="text" placeholder="e.g. space movies, batman, superheroes..."
               class="flex-1 bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-lg text-sm text-white focus:outline-none" />
        <button onclick="askAI()" class="bg-amber-500 hover:bg-amber-600 text-black px-4 py-1.5 rounded-lg font-bold text-sm">Ask</button>
      </div>
      <div id="aiOutput" class="hidden mt-3 p-3 bg-gray-800 rounded-lg text-sm text-amber-200"></div>
    </div>

    <!-- Booking Form -->
    <form onsubmit="handleBooking(event)" class="bg-gray-900 border border-gray-800 p-5 rounded-xl space-y-4 shadow">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Select Movie (Rs. 200/seat)</label>
        <select id="movieSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white"></select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Show Timing</label>
        <select id="timingSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white"></select>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Tickets</label>
          <input type="number" id="tickets" min="1" value="1" oninput="updateTotal()" required
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Name</label>
          <input type="text" id="custName" required placeholder="Your Name"
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Phone</label>
          <input type="tel" id="custPhone" required placeholder="Phone"
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white" />
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-gray-800">
        <span class="text-sm font-semibold">Total: <span id="totalDisplay" class="text-amber-400 font-bold">Rs. 200</span></span>
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg font-bold text-sm text-white">Book Now</button>
      </div>
    </form>

    <!-- Receipt Display -->
    <div id="receipt" class="hidden bg-gray-900 border border-emerald-500/50 p-4 rounded-xl text-sm space-y-1">
      <h3 class="text-emerald-400 font-bold text-base mb-2">🎉 Booking Confirmed!</h3>
      <p id="recId" class="text-gray-400 text-xs mb-2"></p>
      <p><strong>Name:</strong> <span id="recName"></span></p>
      <p><strong>Phone:</strong> <span id="recPhone"></span></p>
      <p><strong>Movie:</strong> <span id="recMovie"></span></p>
      <p><strong>Show Time:</strong> <span id="recTiming"></span></p>
      <p><strong>Tickets:</strong> <span id="recTickets"></span></p>
      <p><strong>Total Amount:</strong> <span id="recTotal" class="text-amber-400 font-bold"></span></p>
    </div>

  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function loadData() {
      const res = await fetch(`${API}/config`);
      const data = await res.json();
      
      const movieEl = document.getElementById("movieSelect");
      movieEl.innerHTML = data.movies.map((m, i) => `<option value="${i}">${m}</option>`).join("");

      const timeEl = document.getElementById("timingSelect");
      timeEl.innerHTML = data.timings.map((t, i) => `<option value="${i}">${t}</option>`).join("");
    }

    function updateTotal() {
      const count = parseInt(document.getElementById("tickets").value) || 0;
      document.getElementById("totalDisplay").innerText = `Rs. ${count * 200}`;
    }

    async function askAI() {
      const query = document.getElementById("aiInput").value;
      if (!query) return;
      const res = await fetch(`${API}/ai-recommend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      const out = document.getElementById("aiOutput");
      out.classList.remove("hidden");
      out.innerHTML = `<strong>Try: ${data.recommended_movie}</strong><br>${data.reason}`;
    }

    async function handleBooking(e) {
      e.preventDefault();
      const payload = {
        movie_index: parseInt(document.getElementById("movieSelect").value),
        timing_index: parseInt(document.getElementById("timingSelect").value),
        tickets: parseInt(document.getElementById("tickets").value),
        name: document.getElementById("custName").value,
        phone: document.getElementById("custPhone").value
      };

      const res = await fetch(`${API}/book`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      document.getElementById("recId").innerText = `Reference: ${data.booking_id}`;
      document.getElementById("recName").innerText = data.name;
      document.getElementById("recPhone").innerText = data.phone;
      document.getElementById("recMovie").innerText = data.movie;
      document.getElementById("recTiming").innerText = data.timing;
      document.getElementById("recTickets").innerText = data.tickets;
      document.getElementById("recTotal").innerText = `Rs. ${data.total_amount}`;
      document.getElementById("receipt").classList.remove("hidden");
    }

    loadData();
  </script>
</body>
</html>
